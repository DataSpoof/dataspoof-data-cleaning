image:
  repository: ghcr.io/dataspoof/automatedcleaning-hub
  tag: "2.0.0"
  pullPolicy: IfNotPresent
replicas: 2
workers: 2

# Database: a PostgreSQL URL in a Secret you manage (recommended), or let the chart create one.
database:
  existingSecret: ""          # Secret with key DATABASE_URL
  url: ""                     # used only when existingSecret is empty (stored in a chart-managed Secret)

# Artifacts: object storage (recommended: s3://bucket/prefix, gs://..., az://...) or a PVC path.
artifacts:
  root: "s3://my-ml-artifacts/hub"
  persistence:                # only for a filesystem root, e.g. /data/artifacts
    enabled: false
    size: 50Gi
    storageClass: ""

# Single sign-on (OIDC). Leave issuer empty to use API tokens only.
oidc:
  issuer: ""
  audience: "automatedcleaning-hub"
  jwksUrl: ""
  groupRoles: {}              # e.g. {"ml-admins": ["*", "admin"], "churn-team": ["churn", "data_scientist"]}

modelPublicKey: ""            # PEM; when set, only models signed by the matching key can be registered
maxArtifactMB: 500
extraEnv: []

serviceAccount:
  create: true
  name: ""
  annotations: {}             # e.g. eks.amazonaws.com/role-arn for S3 access via IRSA / workload identity

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  host: hub.example.com
  annotations: {}
  tls:
    enabled: true
    secretName: hub-tls

resources:
  requests: {cpu: 250m, memory: 512Mi}
  limits: {cpu: "2", memory: 2Gi}

podDisruptionBudget:
  minAvailable: 1
nodeSelector: {}
tolerations: []
affinity: {}
