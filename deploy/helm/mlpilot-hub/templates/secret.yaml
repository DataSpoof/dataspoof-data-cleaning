{{- if not .Values.database.existingSecret }}
{{- if not .Values.database.url }}{{ fail "Set database.url or database.existingSecret" }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hub.dbSecret" . }}
  labels: {{- include "hub.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.database.url | quote }}
{{- end }}
