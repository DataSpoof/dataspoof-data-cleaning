# Prometheus + Grafana for MLPilot model services, pre-provisioned with the
# "MLPilot - model service" dashboard and the alert rules.
#
#   MODEL_TARGET=host.docker.internal:8000 docker compose up -d
#   open http://localhost:3000  (admin / $GRAFANA_ADMIN_PASSWORD)   and   http://localhost:9090/alerts
#
# The model service: `mlpilot serve model_dir --port 8000` or the image from
# `mlpilot container`, ideally with AC_MONITOR_PATH set so drift and estimated
# performance are exported too.
services:
  prometheus:
    image: prom/prometheus:v3.4.1
    # writes the scrape-target file from $MODEL_TARGET (comma-separated host:port list), then starts Prometheus
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mkdir -p /prometheus/targets &&
        printf '[{"targets": ["%s"], "labels": {"service": "model-api"}}]' "$$(echo $$MODEL_TARGET | sed 's/,/","/g')"
        > /prometheus/targets/model.json &&
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus
        --storage.tsdb.retention.time=30d --web.enable-lifecycle
    environment:
      MODEL_TARGET: ${MODEL_TARGET:-host.docker.internal:8000}
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports: ["${PROMETHEUS_PORT:-9090}:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.0.2
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/mlpilot-model.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["${GRAFANA_PORT:-3000}:3000"]
    depends_on: [prometheus]
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
