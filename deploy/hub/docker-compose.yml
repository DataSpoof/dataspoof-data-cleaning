# Hub + PostgreSQL for a single host / evaluation.  From the repository root:
#   docker compose -f deploy/hub/docker-compose.yml up -d --build
#   docker compose -f deploy/hub/docker-compose.yml exec hub automatedcleaning hub create-admin --name admin
# Put it behind TLS (a reverse proxy / load balancer) before exposing it beyond localhost.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hub
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: ${HUB_DB_PASSWORD:-change-me-in-production}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d hub"]
      interval: 5s
      retries: 20
  hub:
    build: {context: ../.., dockerfile: deploy/hub/Dockerfile}
    image: automatedcleaning-hub:local
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      AC_HUB_DATABASE_URL: postgresql+psycopg://hub:${HUB_DB_PASSWORD:-change-me-in-production}@postgres:5432/hub
      AC_HUB_ARTIFACTS: /data/artifacts
      # Single sign-on (optional):
      # AC_OIDC_ISSUER: https://login.microsoftonline.com/<tenant>/v2.0
      # AC_OIDC_AUDIENCE: api://automatedcleaning-hub
      # AC_HUB_GROUP_ROLES: '{"ml-admins": ["*", "admin"], "churn-team": ["churn", "data_scientist"]}'
    ports: ["127.0.0.1:${HUB_PORT:-8080}:8080"]
    volumes: [artifacts:/data]
volumes:
  pgdata: {}
  artifacts: {}
