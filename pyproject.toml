[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
# Formerly published as "AutomatedCleaning" (up to 2.0.0); that project now forwards here.
name = "mlpilot"
version = "2.1.0"
description = "MLPilot (formerly AutomatedCleaning): automated data science, from raw data to monitored production models, with a Rust engine"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Abhishek Kumar Singh", email = "dataspoof007@gmail.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
keywords = ["mlops", "automl", "data cleaning", "data quality", "feature engineering", "model monitoring", "polars"]

# A lean core: what every module needs. Heavier dependencies live in the extras below
# (pip install "mlpilot[all]" gets everything, like the 1.x releases did).
dependencies = [
    "polars>=1.23",
    "pandas>=2.2",
    "numpy>=2.0",
    "pyarrow>=19.0",
    "scikit-learn>=1.5",
    # cleaning steps
    "rapidfuzz>=3.0",
    "phonenumbers>=8.13",
    "email-validator>=2.0",
    "python-dateutil>=2.9",
    # pipeline configs and data contracts in YAML
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# The interactive clean_data() flow, the EDA dashboard and PII masking.
nlp = [
    "nltk>=3.9",
]
dashboard = [
    "plotly>=6.0",
    "matplotlib>=3.9",
    "missingno>=0.5",
    "pyfiglet>=1.0",
]
pii = [
    "presidio-analyzer",
    "presidio-anonymizer",
]
# Extra text-cleaning steps that pull heavier/optional dependencies.
text = [
    "langdetect>=1.0",
    "better-profanity>=0.7",
    "pyspellchecker>=0.8",
]
test = [
    "pytest>=8.0",
]
# Extra AutoML model families (used automatically when installed).
automl = [
    "lightgbm>=4.0",
    "xgboost>=2.0",
]
# shap's plotting library, for Explanation.to_shap(). SHAP values themselves need nothing extra.
explain = [
    "shap>=0.45",
]
# Ingestion connectors. Cloud storage (S3/GCS/Azure) needs nothing extra (Polars reads it natively).
sql = [
    "sqlalchemy>=2.0",          # plus your database's driver, e.g. psycopg, pymysql, pyodbc, oracledb
]
excel = [
    "fastexcel>=0.11",
]
snowflake = [
    "snowflake-connector-python[pandas]>=3.0",
]
bigquery = [
    "google-cloud-bigquery>=3.0",
    "google-cloud-bigquery-storage>=2.0",
]
# ONNX export (deploy.export_model(format="onnx")) and checking it with ONNX Runtime.
onnx = [
    "skl2onnx>=1.17",
    "onnxruntime>=1.17",
]
# The Hub platform server (mlpilot hub serve): API, SSO, registry, approvals, audit, UI.
server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "pyjwt[crypto]>=2.8",
    "python-multipart>=0.0.9",
    "fsspec>=2024.2",
    "psycopg[binary]>=3.1",
]
# Image and audio data (mlpilot.media). WAV audio needs nothing extra.
image = [
    "pillow>=10.0",
]
audio = [
    "soundfile>=0.12",
]
# Bridges to tools your team may already run (not in [all]: each pulls a large dependency tree).
mlflow = [
    "mlflow>=3.0",               # export runs / registry, pyfunc models for `mlflow models serve`
]
dvc = [
    "dvc>=3.0",                  # plus git on PATH; add dvc-s3 / dvc-gs / dvc-azure for cloud remotes
]
feast = [
    "feast>=0.40",               # export the feature store as a Feast repository
]
evidently = [
    "evidently>=0.7",            # Evidently drift / performance reports next to the built-in monitoring
]
# AWS: Glue Data Catalog + jobs, SageMaker / ECR deployment, aws-sm:// secrets.
aws = [
    "boto3>=1.34",
]
# Azure: DefaultAzureCredential for Data Factory (a plain token works without it).
azure = [
    "azure-identity>=1.15",
]
# Bayesian hyperparameter search: AutoML(search="optuna").
optuna = [
    "optuna>=3.0",
]
# Safer model export (deploy.export_model(format="skops")) and model signing (security.sign_model).
skops = [
    "skops>=0.10",
]
signing = [
    "cryptography>=42",
]
# Production WSGI servers for the REST API (gunicorn on Linux/macOS, waitress on Windows).
serve = [
    "gunicorn>=22.0; platform_system != 'Windows'",
    "waitress>=3.0; platform_system == 'Windows'",
]
# Claude: executive narratives (insights_report(..., llm=True)) and AI categorical fixes in clean_data().
llm = [
    "anthropic>=2.5",
    "langchain-anthropic>=0.3",
]
# Neural text embeddings for TextEmbeddings(method="sentence_transformers").
embeddings = [
    "sentence-transformers>=2.0",
]
# Everything (what 1.x installed by default, plus every optional connector and integration).
all = [
    "mlpilot[nlp,dashboard,pii,llm,text,automl,explain,sql,excel,onnx,serve,optuna,skops,signing,server,image,audio,aws,azure]",
]
dev = [
    "mlpilot[all,test]",
    "mypy>=1.10",
    "pip-audit>=2.7",
]

[project.scripts]
mlpilot = "mlpilot.deploy.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[project.urls]
Homepage = "https://github.com/DataSpoof/dataspoof-data-cleaning"
Repository = "https://github.com/DataSpoof/dataspoof-data-cleaning"
Documentation = "https://dataspoof.github.io/dataspoof-data-cleaning/"
Changelog = "https://github.com/DataSpoof/dataspoof-data-cleaning/blob/main/CHANGELOG.md"
Issues = "https://github.com/DataSpoof/dataspoof-data-cleaning/issues"

[tool.maturin]
# Mixed Rust/Python project: the `mlpilot` package lives at the repo
# root and the compiled extension is injected into it as `_rustcore`.
python-source = "."
module-name = "mlpilot._rustcore"
features = ["pyo3/extension-module"]
# The sdist is built from the working tree: keep local, machine-specific files out of it.
exclude = [
    { path = ".claude/**/*", format = "sdist" },
    { path = "assets/**/*", format = "sdist" },
    { path = "images/**/*", format = "sdist" },
    { path = "example.py", format = "sdist" },
    { path = "requirements.txt", format = "sdist" },
    { path = "compat/**/*", format = "sdist" },
    { path = "automatedcleaning/**/*", format = "sdist" },
]

[tool.mypy]
python_version = "3.11"
packages = ["mlpilot"]
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
check_untyped_defs = false
# Polars types scalar results (Series.max(), .item(), ...) as a union of every Python literal
# type, so comparisons and arithmetic on them can't be checked statically; skip those codes.
disable_error_code = ["operator", "union-attr", "call-overload"]
implicit_optional = true

# Legacy modules from the 1.x interactive cleaner: type them gradually; listed here so the
# debt is visible. New modules must type-check.
[[tool.mypy.overrides]]
module = ["mlpilot.cleaning", "mlpilot.steps", "mlpilot.quality.profile",
          "mlpilot.quality.checks"]
ignore_errors = true
