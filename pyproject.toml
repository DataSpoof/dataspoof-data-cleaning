[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
# PyPI requires the normalized (lowercase) distribution name in build artifacts.
# This is the SAME project as "AutomatedCleaning" — `pip install AutomatedCleaning`
# still works because pip normalizes names case-insensitively.
name = "automatedcleaning"
version = "1.14.0"
description = "Automated Data Cleaning Library with a Rust compute backend"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Abhishek Kumar Singh", email = "dataspoof007@gmail.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

# Python-side runtime dependencies. The heavy per-row/number-crunching work now
# lives in the Rust backend (`automatedcleaning._rustcore`); these libraries
# cover the parts that stay in Python (I/O, ML, dashboards, PII, AI).
dependencies = [
    "polars>=1.23",
    "pandas>=2.2",
    "numpy>=2.0",
    "pyarrow>=19.0",
    "nltk>=3.9",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "missingno>=0.5",
    "plotly>=6.0",
    "pyfiglet>=1.0",
    "langchain-anthropic>=0.3",
    "presidio-analyzer",
    "presidio-anonymizer",
    # Additional cleaning steps
    "rapidfuzz>=3.0",
    "phonenumbers>=8.13",
    "email-validator>=2.0",
    "python-dateutil>=2.9",
    # Pipeline configs in YAML
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Extra text-cleaning steps that pull heavier/optional dependencies.
text = [
    "langdetect>=1.0",
    "better-profanity>=0.7",
    "pyspellchecker>=0.8",
]
test = [
    "pytest>=8.0",
]
# Extra AutoML model families (used automatically when installed).
automl = [
    "lightgbm>=4.0",
    "xgboost>=2.0",
]
# shap's plotting library, for Explanation.to_shap(). SHAP values themselves need nothing extra.
explain = [
    "shap>=0.45",
]
# Ingestion connectors. Cloud storage (S3/GCS/Azure) needs nothing extra (Polars reads it natively).
sql = [
    "sqlalchemy>=2.0",          # plus your database's driver, e.g. psycopg, pymysql, pyodbc, oracledb
]
excel = [
    "fastexcel>=0.11",
]
snowflake = [
    "snowflake-connector-python[pandas]>=3.0",
]
bigquery = [
    "google-cloud-bigquery>=3.0",
    "google-cloud-bigquery-storage>=2.0",
]
# ONNX export (deploy.export_model(format="onnx")) and checking it with ONNX Runtime.
onnx = [
    "skl2onnx>=1.17",
    "onnxruntime>=1.17",
]
# Production WSGI servers for the REST API (gunicorn on Linux/macOS, waitress on Windows).
serve = [
    "gunicorn>=22.0; platform_system != 'Windows'",
    "waitress>=3.0; platform_system == 'Windows'",
]
# LLM-written executive narratives (insights_report(..., llm=True)) with Claude.
llm = [
    "anthropic>=2.5",
]
# Neural text embeddings for TextEmbeddings(method="sentence_transformers").
embeddings = [
    "sentence-transformers>=2.0",
]

[project.scripts]
automatedcleaning = "automatedcleaning.deploy.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[project.urls]
Homepage = "https://github.com/DataSpoof/dataspoof-data-cleaning"
Repository = "https://github.com/DataSpoof/dataspoof-data-cleaning"

[tool.maturin]
# Mixed Rust/Python project: the `automatedcleaning` package lives at the repo
# root and the compiled extension is injected into it as `_rustcore`.
python-source = "."
module-name = "automatedcleaning._rustcore"
features = ["pyo3/extension-module"]
