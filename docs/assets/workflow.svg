<svg viewBox="0 0 1320 896" role="img" aria-label="AutomatedCleaning workflow in four lanes: data in, build and validate, release through isolated dev, QA and prod registries, and operate with feedback, monitoring and a retraining loop back to AutoML. Five gates can stop a run." xmlns="http://www.w3.org/2000/svg" width="1320" height="896"><title>AutomatedCleaning workflow</title><style>
svg { --bg:#ffffff; --surface:#ffffff; --ink:#18212b; --muted:#5a6673; --line:#a3aeb9; --accent:#1f5fbf;
  --loop:#c4521b; --gate:#a86a00; --gate-soft:#fff4dd; --rail:#eef1f4; }
@media (prefers-color-scheme: dark) { svg { --bg:#0d1117; --surface:#161b22; --ink:#e6edf3; --muted:#9aa8b5;
  --line:#4f5d6b; --accent:#6ea8ff; --loop:#ff8a50; --gate:#f2b84b; --gate-soft:#2b2416; --rail:#11161d; } }
.bgr { fill: var(--bg); }
.node rect { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
.node.gate > rect:first-child { fill: var(--gate-soft); stroke: var(--gate); stroke-width: 1.6; }
.node .badge { fill: var(--gate); stroke: none; } .bt { fill: var(--surface); font: 600 9.5px ui-monospace, Consolas, monospace; letter-spacing: .08em; }
.nt { fill: var(--ink); font: 600 13.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
.ns { fill: var(--muted); font: 400 10.5px ui-monospace, "Cascadia Mono", Consolas, monospace; }
.ll { fill: var(--ink); font: 700 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: .07em; }
.lln { fill: var(--muted); font-weight: 400; letter-spacing: 0; }
.e { fill: none; stroke-width: 1.6; } .e.flow { stroke: var(--accent); }
.e.test { stroke: var(--accent); stroke-dasharray: 5 4; } .e.loop { stroke: var(--loop); stroke-width: 2.2; }
.mh.flow, .mh.test { fill: var(--accent); } .mh.loop { fill: var(--loop); }
.el { fill: var(--muted); font: 500 10px ui-monospace, Consolas, monospace; } .loop-t { fill: var(--loop); font-weight: 600; }
.rail { fill: var(--rail); stroke: var(--line); stroke-dasharray: 3 3; } .chip rect { fill: var(--surface); stroke: var(--line); }
</style><rect class="bgr" x="0" y="0" width="1320" height="896"/><defs><marker id="m-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mh flow" d="M0 0 L10 5 L0 10 z"/></marker><marker id="m-test" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mh test" d="M0 0 L10 5 L0 10 z"/></marker><marker id="m-loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mh loop" d="M0 0 L10 5 L0 10 z"/></marker></defs><text class="ll" x="248" y="54">1 · DATA IN<tspan class="lln" dx="10">sources to a clean, versioned, split dataset</tspan></text><text class="ll" x="248" y="246">2 · BUILD &amp; VALIDATE<tspan class="lln" dx="10">training rows to a registered model</tspan></text><text class="ll" x="248" y="438">3 · RELEASE<tspan class="lln" dx="10">isolated registries; each release copies the exact artifact</tspan></text><text class="ll" x="248" y="630">4 · OPERATE<tspan class="lln" dx="10">serve, learn from real outcomes, retrain</tspan></text><g class="node"><rect x="30" y="70" width="168" height="72" rx="6"/><text class="nt" x="44" y="96">Data sources</text><text class="ns" x="44" y="115">files · S3 · GCS · Azure</text><text class="ns" x="44" y="130">SQL · Snowflake · APIs</text></g><g class="node"><rect x="248" y="70" width="168" height="72" rx="6"/><text class="nt" x="262" y="96">Ingest</text><text class="ns" x="262" y="115">schema inference</text><text class="ns" x="262" y="130">incremental loads</text></g><g class="node"><rect x="466" y="70" width="168" height="72" rx="6"/><text class="nt" x="480" y="96">Version</text><text class="ns" x="480" y="115">DataRepository · DVC</text><text class="ns" x="480" y="130">Glue catalog</text></g><g class="node"><rect x="684" y="70" width="168" height="72" rx="6"/><text class="nt" x="698" y="96">Clean</text><text class="ns" x="698" y="115">stateful pipeline</text><text class="ns" x="698" y="130">Rust core · PII masking</text></g><g class="node gate"><rect x="902" y="70" width="168" height="72" rx="6"/><text class="nt" x="916" y="96">Quality gate</text><text class="ns" x="916" y="115">0-100 quality score</text><text class="ns" x="916" y="130">data contracts</text><rect class="badge" x="1020" y="61" width="42" height="17" rx="8.5"/><text class="bt" x="1041" y="73" text-anchor="middle">GATE</text></g><g class="node"><rect x="1120" y="70" width="168" height="72" rx="6"/><text class="nt" x="1134" y="96">Split</text><text class="ns" x="1134" y="115">stratified · group · time</text><text class="ns" x="1134" y="130">leakage checks</text></g><line class="e flow" x1="198" y1="106.0" x2="245" y2="106.0" marker-end="url(#m-flow)"/><text class="el" x="221.5" y="98.0" text-anchor="middle">read</text><line class="e flow" x1="416" y1="106.0" x2="463" y2="106.0" marker-end="url(#m-flow)"/><text class="el" x="439.5" y="98.0" text-anchor="middle">commit</text><line class="e flow" x1="634" y1="106.0" x2="681" y2="106.0" marker-end="url(#m-flow)"/><text class="el" x="657.5" y="98.0" text-anchor="middle">vN</text><line class="e flow" x1="852" y1="106.0" x2="899" y2="106.0" marker-end="url(#m-flow)"/><text class="el" x="875.5" y="98.0" text-anchor="middle">clean</text><line class="e flow" x1="1070" y1="106.0" x2="1117" y2="106.0" marker-end="url(#m-flow)"/><text class="el" x="1093.5" y="98.0" text-anchor="middle">pass</text><g class="node"><rect x="1120" y="262" width="168" height="72" rx="6"/><text class="nt" x="1134" y="288">Features</text><text class="ns" x="1134" y="307">dates · encodings · lags</text><text class="ns" x="1134" y="322">feature store (as-of)</text></g><g class="node gate"><rect x="902" y="262" width="168" height="72" rx="6"/><text class="nt" x="916" y="288">Poisoning check</text><text class="ns" x="916" y="307">label errors</text><text class="ns" x="916" y="322">backdoor triggers</text><rect class="badge" x="1020" y="253" width="42" height="17" rx="8.5"/><text class="bt" x="1041" y="265" text-anchor="middle">GATE</text></g><g class="node"><rect x="684" y="262" width="168" height="72" rx="6"/><text class="nt" x="698" y="288">AutoML</text><text class="ns" x="698" y="307">search · ensemble</text><text class="ns" x="698" y="322">conformal intervals</text></g><g class="node"><rect x="466" y="262" width="168" height="72" rx="6"/><text class="nt" x="480" y="288">Evaluate</text><text class="ns" x="480" y="307">metrics · SHAP</text><text class="ns" x="480" y="322">fairness · robustness</text></g><g class="node gate"><rect x="248" y="262" width="168" height="72" rx="6"/><text class="nt" x="262" y="288">CI gate</text><text class="ns" x="262" y="307">gates.yml thresholds</text><text class="ns" x="262" y="322">fails the build</text><rect class="badge" x="366" y="253" width="42" height="17" rx="8.5"/><text class="bt" x="387" y="265" text-anchor="middle">GATE</text></g><g class="node"><rect x="30" y="262" width="168" height="72" rx="6"/><text class="nt" x="44" y="288">Register · dev</text><text class="ns" x="44" y="307">checksum · signature</text><text class="ns" x="44" y="322">runs -&gt; MLflow</text></g><line class="e flow" x1="1120" y1="298.0" x2="1073" y2="298.0" marker-end="url(#m-flow)"/><text class="el" x="1096.5" y="290.0" text-anchor="middle">rows</text><line class="e flow" x1="902" y1="298.0" x2="855" y2="298.0" marker-end="url(#m-flow)"/><text class="el" x="878.5" y="290.0" text-anchor="middle">clean</text><line class="e flow" x1="684" y1="298.0" x2="637" y2="298.0" marker-end="url(#m-flow)"/><text class="el" x="660.5" y="290.0" text-anchor="middle">model</text><line class="e flow" x1="466" y1="298.0" x2="419" y2="298.0" marker-end="url(#m-flow)"/><text class="el" x="442.5" y="290.0" text-anchor="middle">report</text><line class="e flow" x1="248" y1="298.0" x2="201" y2="298.0" marker-end="url(#m-flow)"/><text class="el" x="224.5" y="290.0" text-anchor="middle">pass</text><g class="node"><rect x="30" y="454" width="168" height="72" rx="6"/><text class="nt" x="44" y="480">dev registry</text><text class="ns" x="44" y="499">stage: staging</text><text class="ns" x="44" y="514">own storage</text></g><g class="node gate"><rect x="248" y="454" width="168" height="72" rx="6"/><text class="nt" x="262" y="480">Release to QA</text><text class="ns" x="262" y="499">order · source stage</text><text class="ns" x="262" y="514">metric floors</text><rect class="badge" x="366" y="445" width="42" height="17" rx="8.5"/><text class="bt" x="387" y="457" text-anchor="middle">GATE</text></g><g class="node"><rect x="466" y="454" width="168" height="72" rx="6"/><text class="nt" x="480" y="480">QA registry</text><text class="ns" x="480" y="499">stage: qa</text><text class="ns" x="480" y="514">QA sign-off</text></g><g class="node gate"><rect x="684" y="454" width="168" height="72" rx="6"/><text class="nt" x="698" y="480">Release to prod</text><text class="ns" x="698" y="499">2 approvers · OPA</text><text class="ns" x="698" y="514">signature verified</text><rect class="badge" x="802" y="445" width="42" height="17" rx="8.5"/><text class="bt" x="823" y="457" text-anchor="middle">GATE</text></g><g class="node"><rect x="902" y="454" width="168" height="72" rx="6"/><text class="nt" x="916" y="480">prod registry</text><text class="ns" x="916" y="499">staging -&gt; production</text><text class="ns" x="916" y="514">provenance recorded</text></g><g class="node"><rect x="1120" y="454" width="168" height="72" rx="6"/><text class="nt" x="1134" y="480">Deploy</text><text class="ns" x="1134" y="499">REST · SageMaker · ECS</text><text class="ns" x="1134" y="514">blue/green · canary</text></g><line class="e flow" x1="198" y1="490.0" x2="245" y2="490.0" marker-end="url(#m-flow)"/><text class="el" x="221.5" y="482.0" text-anchor="middle">vN</text><line class="e flow" x1="416" y1="490.0" x2="463" y2="490.0" marker-end="url(#m-flow)"/><text class="el" x="439.5" y="482.0" text-anchor="middle">copy</text><line class="e flow" x1="634" y1="490.0" x2="681" y2="490.0" marker-end="url(#m-flow)"/><text class="el" x="657.5" y="482.0" text-anchor="middle">vN</text><line class="e flow" x1="852" y1="490.0" x2="899" y2="490.0" marker-end="url(#m-flow)"/><text class="el" x="875.5" y="482.0" text-anchor="middle">copy</text><line class="e flow" x1="1070" y1="490.0" x2="1117" y2="490.0" marker-end="url(#m-flow)"/><text class="el" x="1093.5" y="482.0" text-anchor="middle">image</text><g class="node"><rect x="1120" y="646" width="168" height="72" rx="6"/><text class="nt" x="1134" y="672">Serve</text><text class="ns" x="1134" y="691">POST /predict</text><text class="ns" x="1134" y="706">hot reload on promote</text></g><g class="node"><rect x="902" y="646" width="168" height="72" rx="6"/><text class="nt" x="916" y="672">Apps &amp; users</text><text class="ns" x="916" y="691">act on predictions</text><text class="ns" x="916" y="706">keep prediction IDs</text></g><g class="node"><rect x="684" y="646" width="168" height="72" rx="6"/><text class="nt" x="698" y="672">Feedback</text><text class="ns" x="698" y="691">POST /feedback</text><text class="ns" x="698" y="706">outcomes · ratings</text></g><g class="node"><rect x="466" y="646" width="168" height="72" rx="6"/><text class="nt" x="480" y="672">Monitor</text><text class="ns" x="480" y="691">PSI drift · CBPE</text><text class="ns" x="480" y="706">live accuracy</text></g><g class="node"><rect x="248" y="646" width="168" height="72" rx="6"/><text class="nt" x="262" y="672">Alerts</text><text class="ns" x="262" y="691">Prometheus · Grafana</text><text class="ns" x="262" y="706">PagerDuty · Opsgenie</text></g><g class="node"><rect x="30" y="646" width="168" height="72" rx="6"/><text class="nt" x="44" y="672">Retrain</text><text class="ns" x="44" y="691">champion vs challenger</text><text class="ns" x="44" y="706">promote only if better</text></g><line class="e flow" x1="1120" y1="682.0" x2="1073" y2="682.0" marker-end="url(#m-flow)"/><text class="el" x="1096.5" y="674.0" text-anchor="middle">result</text><line class="e flow" x1="902" y1="682.0" x2="855" y2="682.0" marker-end="url(#m-flow)"/><text class="el" x="878.5" y="674.0" text-anchor="middle">truth</text><line class="e flow" x1="684" y1="682.0" x2="637" y2="682.0" marker-end="url(#m-flow)"/><text class="el" x="660.5" y="674.0" text-anchor="middle">labels</text><line class="e flow" x1="466" y1="682.0" x2="419" y2="682.0" marker-end="url(#m-flow)"/><text class="el" x="442.5" y="674.0" text-anchor="middle">gauges</text><line class="e flow" x1="248" y1="682.0" x2="201" y2="682.0" marker-end="url(#m-flow)"/><text class="el" x="224.5" y="674.0" text-anchor="middle">fire</text><path class="e flow" d="M1250 142 V259" marker-end="url(#m-flow)"/><text class="el flow-t" x="1242" y="232" text-anchor="end">train</text><path class="e test" d="M1160 142 V200 H550 V259" marker-end="url(#m-test)"/><text class="el test-t" x="860" y="193" text-anchor="middle">held-out test split</text><path class="e flow" d="M114 334 V451" marker-end="url(#m-flow)"/><text class="el flow-t" x="122" y="404" text-anchor="start">register</text><path class="e flow" d="M1204 526 V643" marker-end="url(#m-flow)"/><text class="el flow-t" x="1196" y="596" text-anchor="end">go live</text><path class="e test" d="M1160 718 V752 H550 V721" marker-end="url(#m-test)"/><text class="el test-t" x="855" y="770" text-anchor="middle">inputs + predictions: drift and estimated accuracy before labels</text><path class="e loop" d="M30 682.0 H12 V228 H768 V259" marker-end="url(#m-loop)"/><text class="el loop-t" x="300" y="221" text-anchor="start">retrain: new challenger model</text><rect class="rail" x="12" y="796" width="1296" height="92" rx="8"/><text class="ll" x="30" y="818">ACROSS EVERY STAGE</text><g class="chip"><rect x="30" y="828" width="236" height="46" rx="6"/><text class="nt" x="42" y="847">Secrets</text><text class="ns" x="42" y="864">vault:// · aws-sm:// · file://</text></g><g class="chip"><rect x="284" y="828" width="236" height="46" rx="6"/><text class="nt" x="296" y="847">Policy</text><text class="ns" x="296" y="864">OPA rules on access + releases</text></g><g class="chip"><rect x="538" y="828" width="236" height="46" rx="6"/><text class="nt" x="550" y="847">Hub</text><text class="ns" x="550" y="864">SSO · roles · hash-chained audit</text></g><g class="chip"><rect x="792" y="828" width="236" height="46" rx="6"/><text class="nt" x="804" y="847">Lineage</text><text class="ns" x="804" y="864">OpenLineage -&gt; Marquez, DataHub</text></g><g class="chip"><rect x="1046" y="828" width="236" height="46" rx="6"/><text class="nt" x="1058" y="847">Tracking</text><text class="ns" x="1058" y="864">runs · metrics · MLflow export</text></g></svg>